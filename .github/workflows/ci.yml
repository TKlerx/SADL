name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the native library against this runner's GSL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgsl-dev
          bash trebaJni/trebaNative/swig/treba_jni.sh
          ldd trebaJni/trebaNative/native_libs/libtreba.so
          mvn -B -f trebaJni/trebaNative/pom.xml install
      - name: Run the complete test suite, including native tests
        run: mvn -B test
